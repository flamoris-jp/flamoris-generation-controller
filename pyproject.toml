[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "flamoris-generation-controller"
version = "0.1.0"
description = "Shared bounded generation domain and internal HTTP adapter"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.11,<3", "Pillow>=11,<13"]

[project.optional-dependencies]
http = ["starlette>=0.40,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "build>=1.2,<2"]

[project.scripts]
flamoris-generation-retention = "flamoris_generation_controller.retention:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flamoris_generation_controller"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
