name: Publish Controller library
on:
  pull_request:
    paths: ['.github/workflows/publish-package.yml', 'release/**']
  push:
    branches: [main]
    paths: ['.github/workflows/publish-package.yml', 'release/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controller-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Record exact package checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: controller-library
          path: dist/
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: controller-library
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api 'repos/'"$GITHUB_REPOSITORY"'/git/ref/tags/v1.0.3' > /dev/null 2>&1; then
            echo 'Release tag already exists; refusing to replace it'
            exit 1
          fi
          gh release create v1.0.3 dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Generation Controller v1.0.3' --notes-file release/NOTES.md --latest
