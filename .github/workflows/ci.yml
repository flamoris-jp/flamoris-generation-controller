name: Controller CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev,http]'
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
      - run: python -m build
      - name: Installed core without MCP or HTTP dependencies
        run: |
          python -m venv "$RUNNER_TEMP/core-wheel"
          "$RUNNER_TEMP/core-wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/core-wheel/bin/python" -c "from importlib.util import find_spec; from flamoris_generation_controller.runtime import GenerationController; assert find_spec('mcp') is None; assert find_spec('starlette') is None"
